proxies:
- shadowsocks:
    name: Upstream-A
    server: 198.51.100.1
    port: 9
    method: aes-256-gcm
    password: REPLACE_UPSTREAM_A_PASSWORD
    tfo: false
    udp_relay: false
    block_quic: true
- socks5:
    name: Mars-via-A
    server: 192.0.2.1
    port: 9
    username: REPLACE_MARS_USERNAME
    password: REPLACE_MARS_PASSWORD
    prev_hop: Upstream-A
    tfo: false
    udp_relay: false
    block_quic: true
policy_groups:
- select:
    name: AI-Mars
    policies:
    - Mars-via-A
    block_quic: true
