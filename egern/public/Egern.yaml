    policy: AI-Mars
    name: AI固定保护
- domain_suffix:
    match: x.ai
    policy: AI-Mars
    name: AI固定保护
- domain_suffix:
    match: yiyan.baidu.com
    policy: AI-Mars
    name: AI固定保护
- domain_suffix:
    match: yuanbao.tencent.com
    policy: AI-Mars
    name: AI固定保护
- domain_suffix:
    match: z.ai
    policy: AI-Mars
    name: AI固定保护
- domain_suffix:
    match: zhipuai.cn
    policy: AI-Mars
    name: AI固定保护
- rule_set:
    match: https://raw.githubusercontent.com/ShiinaWong/stash-configs/main/egern/public/rules/AI.yaml
    update_interval: 86400
    policy: AI-Mars
    name: 远程AI补充：完整Mars链
- domain:
    match: api.ipify.org
    policy: AI-Mars
    name: 完整链路出口/健康检测
- domain:
    match: api64.ipify.org
    policy: AI-Mars
    name: 完整链路出口/健康检测
- domain:
    match: api4.ipify.org
    policy: AI-Mars
    name: 完整链路出口/健康检测
- domain:
    match: ifconfig.me
    policy: AI-Mars
    name: 完整链路出口/健康检测
- domain:
    match: ipinfo.io
    policy: AI-Mars
    name: 完整链路出口/健康检测
- domain:
    match: www.cloudflare.com
    policy: AI-Mars
    name: 完整链路出口/健康检测
- domain:
    match: www.gstatic.com
    policy: AI-Mars
    name: 完整链路出口/健康检测
- ip_cidr:
    match: 1.1.1.1/32
    policy: AI-Mars
    no_resolve: true
    name: 默认DoH经过完整链路
- domain:
    match: dns.alidns.com
    policy: DIRECT
    name: 引导DNS
- domain:
    match: doh.pub
    policy: DIRECT
    name: 引导DNS
- domain_suffix:
    match: local
    policy: DIRECT
    name: 本地域名
- domain_suffix:
    match: lan
    policy: DIRECT
    name: 本地域名
- ip_cidr:
    match: 10.0.0.0/8
    policy: DIRECT
    no_resolve: true
    name: 局域网
- ip_cidr:
    match: 172.16.0.0/12
    policy: DIRECT
    no_resolve: true
    name: 局域网
- ip_cidr:
    match: 192.168.0.0/16
    policy: DIRECT
    no_resolve: true
    name: 局域网
- ip_cidr:
    match: 127.0.0.0/8
    policy: DIRECT
    no_resolve: true
    name: 局域网
- ip_cidr:
    match: 169.254.0.0/16
    policy: DIRECT
    no_resolve: true
    name: 局域网
- domain:
    match: mask.icloud.com
    policy: REJECT
    name: 固定出口：禁用Private Relay
- domain:
    match: mask-h2.icloud.com
    policy: REJECT
    name: 固定出口：禁用Private Relay
- domain:
    match: mask-api.icloud.com
    policy: REJECT
    name: 固定出口：禁用Private Relay
- and:
    match:
    - rule_set:
        match: https://raw.githubusercontent.com/ShiinaWong/stash-configs/main/egern/public/rules/AppleDirect.yaml
        update_interval: 86400
    - or:
        match:
        - protocol:
            match: tcp
        - protocol:
            match: http
        - protocol:
            match: https
    policy: DIRECT
    name: Apple基础服务直连
- rule_set:
    match: https://raw.githubusercontent.com/ShiinaWong/stash-configs/main/egern/public/rules/DomesticDirect.yaml
    update_interval: 86400
    policy: DIRECT
    name: 国内服务直连
- and:
    match:
    - rule_set:
        match: https://raw.githubusercontent.com/ShiinaWong/stash-configs/main/egern/public/rules/MailProxy.yaml
        update_interval: 86400
    - or:
        match:
        - protocol:
            match: tcp
        - protocol:
            match: http
        - protocol:
            match: https
    policy: Upstream-A
    name: 邮件使用机场
- or:
    match:
    - protocol:
        match: udp
    - protocol:
        match: quic
    - protocol:
        match: stun
    policy: REJECT
    name: 非直连数据报未验收：禁止旁路
- default:
    policy: AI-Mars
    name: 未分类流量也保留Mars出口
