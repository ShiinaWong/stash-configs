proxies:
- shadowsocks:
    name: Upstream-A
    server: 198.51.100.1
    port: 9
    method: aes-256-gcm
    password: REPLACE_UPSTREAM_A_PASSWORD
    tfo: false
    udp_relay: false
    block_quic: true
- shadowsocks:
    name: Upstream-B
    server: 198.51.100.2
    port: 9
    method: aes-256-gcm
    password: REPLACE_UPSTREAM_B_PASSWORD
    tfo: false
    udp_relay: false
    block_quic: true
- socks5:
    name: Mars-via-A
    server: 192.0.2.1
    port: 9
    username: REPLACE_MARS_USERNAME
    password: REPLACE_MARS_PASSWORD
    prev_hop: Upstream-A
    tfo: false
    udp_relay: false
    block_quic: true
- socks5:
    name: Mars-via-B
    server: 192.0.2.1
    port: 9
    username: REPLACE_MARS_USERNAME
    password: REPLACE_MARS_PASSWORD
    prev_hop: Upstream-B
    tfo: false
    udp_relay: false
    block_quic: true
