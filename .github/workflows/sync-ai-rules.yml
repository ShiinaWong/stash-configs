name: Sync extended AI rules

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-extended-ai-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/sync_ai_rules.py
      - run: python tools/sync_ai_rules.py --check
      - name: Commit updated rules
        run: |
          if git diff --quiet -- quantumult/rules/Ai-Extended.yaml; then
            echo "No AI rule changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quantumult/rules/Ai-Extended.yaml
          git commit -m "chore: sync extended AI rules"
          git push
